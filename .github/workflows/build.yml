name: Car Thing image
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build installer (nixos-superbird builder)
        run: docker run --privileged -v "$PWD:/workdir" ghcr.io/joeyeamigh/nixos-superbird/builder:latest
      - name: List output
        run: sudo chown -R "$(id -u):$(id -g)" out && ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: carthing-ha-installer
          retention-days: 14
          path: |
            out/bootfs.bin
            out/rootfs.img
            out/meta.json
            out/env.txt
            out/readme.md
